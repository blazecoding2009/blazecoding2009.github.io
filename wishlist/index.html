<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wishlist — Arnnav Kudale</title>
<meta name="description" content="A running wishlist, organized by topic — fits, baking, home, travel and more." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:      #f6f7f9;
  --panel:   #ffffff;
  --panel-2: #fbfbfc;
  --line:    #ececf0;
  --line-2:  #dcdde3;
  --fg:      #15161c;
  --fg-1:    #5b606e;
  --fg-2:    #9aa0ac;
  --p1:      #ff5b1f;
  --p2:      #ff2d75;
  --p3:      #8b5cf6;
  --blue:    #2596e6;
  --disp:    'Space Grotesk', system-ui, sans-serif;
  --body:    'Inter', system-ui, sans-serif;
  --maxw:    1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--p2);color:#fff}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

/* ── back link */
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-1);padding:24px 0 6px;transition:color .2s}
.back:hover{color:var(--fg)}
.back span{font-size:18px}

/* ── BANNER */
.banner{
  position:relative;overflow:hidden;border-radius:28px;
  padding:72px 56px 60px;margin-top:8px;
  background:linear-gradient(135deg, #ff7a3d 0%, #ff2d75 50%, #8b5cf6 100%);
  box-shadow:0 24px 60px -28px rgba(255,45,117,.45);
}
.banner::after{
  content:"";position:absolute;inset:0;opacity:.45;mix-blend-mode:overlay;
  background:radial-gradient(620px 320px at 85% 130%, rgba(255,255,255,.6), transparent 60%);
}
.banner .eyebrow{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.9);position:relative}
.banner h1{font-family:var(--disp);font-weight:700;font-size:clamp(50px,9vw,108px);line-height:.92;letter-spacing:-.03em;color:#fff;margin-top:16px;position:relative;text-shadow:0 4px 24px rgba(0,0,0,.14)}
.banner p{margin-top:20px;max-width:560px;font-size:18px;line-height:1.55;color:rgba(255,255,255,.95);position:relative}
.banner .stats{display:flex;gap:34px;margin-top:36px;position:relative;flex-wrap:wrap}
.banner .stats .s b{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:-.02em;color:#fff;display:block;line-height:1}
.banner .stats .s span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:600}
@media (max-width:680px){.banner{padding:46px 26px 42px;border-radius:22px}}

/* ── inputs */
.fld{font-family:var(--body);font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line-2);border-radius:11px;padding:13px 16px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld::placeholder{color:var(--fg-2)}
.fld:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(255,45,117,.12)}
select.fld{cursor:pointer}
.btn{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.01em;color:#fff;border:none;border-radius:11px;padding:13px 24px;cursor:pointer;transition:transform .12s,filter .2s;white-space:nowrap;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 20px -8px rgba(255,45,117,.5)}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

/* ── add topic */
.new-topic{margin-top:38px}
.new-topic form{display:flex;gap:12px;flex-wrap:wrap}
.new-topic .fld{flex:1;min-width:240px}

/* ── toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:34px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--body);font-size:13px;font-weight:500;color:var(--fg-1);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 17px;cursor:pointer;transition:all .2s}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg);font-weight:600}
.count{font-size:13px;color:var(--fg-2);letter-spacing:.03em}

/* ── topics */
#topics{margin:26px 0 100px;display:flex;flex-direction:column;gap:20px}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:0 1px 2px rgba(16,18,30,.04),0 10px 30px -22px rgba(16,18,30,.25);transition:box-shadow .2s,transform .2s}
.topic:hover{box-shadow:0 1px 2px rgba(16,18,30,.05),0 18px 44px -24px rgba(16,18,30,.3);transform:translateY(-1px)}
.topic-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topic-head h2{font-family:var(--disp);font-weight:600;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.topic-head h2 .emoji{font-size:24px;line-height:1}
.topic-head .right{display:flex;align-items:center;gap:16px}
.tcount{font-size:12px;color:var(--fg-2);letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.topic-del{background:none;border:none;color:var(--fg-2);font-size:13px;cursor:pointer;font-family:var(--body);transition:color .2s}
.topic-del:hover{color:var(--p2)}

/* ── add item */
.item-add{display:grid;grid-template-columns:1fr 120px 130px auto;gap:10px;margin:20px 0 12px}
.item-add .fld,.item-add .btn{padding:11px 14px;font-size:14px;border-radius:10px}
.item-add .fld{background:var(--panel-2)}
@media (max-width:680px){.item-add{grid-template-columns:1fr 1fr}.item-add .btn{grid-column:1/-1}}

/* ── items */
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:15px 0;border-top:1px solid var(--line);transition:opacity .2s}
.item .check{width:22px;height:22px;border:2px solid var(--line-2);border-radius:7px;cursor:pointer;flex:none;transition:all .2s;position:relative}
.item .check:hover{border-color:var(--p2)}
.item.got .check{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent}
.item.got .check::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.item .name{font-size:16px;color:var(--fg);font-weight:500}
.item .sub{font-size:12px;color:var(--fg-2);margin-top:3px}
.item.got .name{color:var(--fg-2);text-decoration:line-through}
.pri{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.pri.want{background:rgba(37,150,230,.12);color:var(--blue)}
.pri.high{background:rgba(255,91,31,.14);color:#e0480f}
.pri.dream{background:rgba(139,92,246,.14);color:#7c3aed}
.price{font-family:var(--disp);font-size:17px;font-weight:600;color:var(--fg)}
.del{background:none;border:none;color:var(--fg-2);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;transition:color .2s}
.del:hover{color:var(--p2)}
.topic-empty{color:var(--fg-2);font-size:14px;padding:6px 0}
@media (max-width:680px){.item{grid-template-columns:auto 1fr auto;gap:12px}.price{display:none}}

/* ── empty */
.empty{text-align:center;padding:80px 20px;background:var(--panel);border:1px dashed var(--line-2);border-radius:20px;color:var(--fg-2)}
.empty .big{font-family:var(--disp);font-size:24px;font-weight:600;color:var(--fg-1);margin-bottom:8px}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:34px 0;border-top:1px solid var(--line);color:var(--fg-2);font-size:13px}
</style>
</head>
<body>

<main class="wrap">

  <a href="/" class="back"><span>←</span> Back to portfolio</a>

  <header class="banner">
    <div class="eyebrow">Saving up · Hunting down · Treating myself</div>
    <h1>Wishlist</h1>
    <p>All the stuff I'm eyeing — fits, baking gear, room upgrades, trips. Organized into topics you can add to. Saved right here in your browser.</p>
    <div class="stats">
      <div class="s"><b id="st-topics">0</b><span>Topics</span></div>
      <div class="s"><b id="st-items">0</b><span>Items</span></div>
      <div class="s"><b id="st-got">0</b><span>Got it</span></div>
    </div>
  </header>

  <section class="new-topic">
    <form id="topic-form">
      <input id="t-name" class="fld" type="text" placeholder="New topic — e.g. Hoodies, Baking, Room, Trips…" autocomplete="off" required />
      <button class="btn" type="submit">+ Add topic</button>
    </form>
  </section>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="open">Wanted</button>
      <button class="chip" data-filter="got">Got it</button>
      <button class="chip" data-filter="high">Need it</button>
      <button class="chip" data-filter="dream">Dreams</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="topics"></div>

  <footer>
    <div>© 2026 Arnnav Kudale</div>
    <div>Oakville, Ontario · Canada</div>
  </footer>

</main>

<script>
const KEY = 'ak-wishlist-v3';
const PRI_LABEL = {want:'Want', high:'Need it', dream:'Dream'};

function emojiFor(name){
  const n = name.toLowerCase();
  const map = [
    [/hood|fit|cloth|shirt|tee|jacket|shoe|sneaker|wear|outfit/, '👕'],
    [/bak|cook|kitchen|food|cake|bread|oven|recipe/, '🧁'],
    [/room|home|desk|decor|furnitur|bed|plant/, '🛋️'],
    [/trip|travel|vacation|flight|trav|japan|europe/, '✈️'],
    [/game|gaming|console|ps5|xbox|switch/, '🎮'],
    [/book|read|novel/, '📚'],
    [/music|head|speaker|vinyl|guitar/, '🎧'],
    [/gym|fit|workout|sport|run|bike/, '🏋️'],
    [/coffee|tea|drink|cafe/, '☕'],
    [/gift|surprise/, '🎁'],
    [/car|drive|moto/, '🚗'],
    [/cam|photo|lens/, '📷'],
  ];
  for(const [re, e] of map){ if(re.test(n)) return e; }
  return '⭐';
}

const seed = [
  {id:1, name:'Hoodies & fits', items:[
    {id:101, name:'Essentials oversized hoodie (cream)', price:'$110', pri:'high',  got:false},
    {id:102, name:'Carhartt beanie',                     price:'$25',  pri:'want',  got:true},
    {id:103, name:'New Balance 9060s',                   price:'$170', pri:'want',  got:false},
    {id:104, name:'Vintage Levi’s denim jacket',         price:'$90',  pri:'dream', got:false},
  ]},
  {id:2, name:'Baking', items:[
    {id:201, name:'KitchenAid stand mixer',     price:'$430', pri:'dream', got:false},
    {id:202, name:'Digital kitchen scale',      price:'$22',  pri:'high',  got:true},
    {id:203, name:'Good vanilla + Dutch cocoa', price:'$30',  pri:'want',  got:false},
    {id:204, name:'Cast iron skillet',          price:'$45',  pri:'want',  got:false},
  ]},
  {id:3, name:'Room glow-up', items:[
    {id:301, name:'LED strip lights',        price:'$28',  pri:'want', got:true},
    {id:302, name:'Monstera + big pot',      price:'$40',  pri:'want', got:false},
    {id:303, name:'Standing desk',           price:'$320', pri:'high', got:false},
  ]},
  {id:4, name:'Trips & someday', items:[
    {id:401, name:'Japan in spring (sakura)', price:'—', pri:'dream', got:false},
    {id:402, name:'Road trip out west',       price:'—', pri:'want',  got:false},
  ]},
];

let topics = load();
let filter = 'all';
let nextId = freshId();

function freshId(){
  let m = 0;
  topics.forEach(t=>{ m=Math.max(m,t.id); t.items.forEach(i=>m=Math.max(m,i.id)); });
  return m + 1;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return seed.slice();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(topics)); }catch(e){} }

const topicsEl = document.getElementById('topics');
const countEl = document.getElementById('count');

function matches(it){
  if(filter==='all')  return true;
  if(filter==='open') return !it.got;
  if(filter==='got')  return it.got;
  return it.pri===filter;
}

function render(){
  topicsEl.innerHTML = '';

  if(!topics.length){
    topicsEl.innerHTML = '<div class="empty"><div class="big">No topics yet</div><div>Add one above to start your list.</div></div>';
  }

  for(const t of topics){
    const visible = t.items.filter(matches);

    const sec = document.createElement('section');
    sec.className = 'topic';

    const head = document.createElement('div');
    head.className = 'topic-head';
    const h2 = document.createElement('h2');
    h2.innerHTML = '<span class="emoji"></span><span class="tname"></span>';
    h2.querySelector('.emoji').textContent = emojiFor(t.name);
    h2.querySelector('.tname').textContent = t.name;
    const right = document.createElement('div');
    right.className = 'right';
    const tcount = document.createElement('span');
    tcount.className = 'tcount';
    const gotN = t.items.filter(i=>i.got).length;
    tcount.textContent = t.items.length + ' item' + (t.items.length!==1?'s':'') + ' · ' + gotN + ' got';
    const tdel = document.createElement('button');
    tdel.className = 'topic-del';
    tdel.textContent = 'Remove';
    tdel.addEventListener('click', ()=>removeTopic(t.id));
    right.appendChild(tcount); right.appendChild(tdel);
    head.appendChild(h2); head.appendChild(right);
    sec.appendChild(head);

    const form = document.createElement('form');
    form.className = 'item-add';
    form.innerHTML =
      '<input class="fld i-name" type="text" placeholder="Add an item…" autocomplete="off" required />' +
      '<input class="fld i-price" type="text" placeholder="Price" autocomplete="off" />' +
      '<select class="fld i-pri"><option value="want">Want</option><option value="high">Need it</option><option value="dream">Dream</option></select>' +
      '<button class="btn" type="submit">Add</button>';
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const name = form.querySelector('.i-name').value.trim();
      if(!name) return;
      t.items.unshift({
        id: nextId++, name,
        price: form.querySelector('.i-price').value.trim(),
        pri: form.querySelector('.i-pri').value,
        got: false,
      });
      save(); render();
    });
    sec.appendChild(form);

    if(!t.items.length){
      const e = document.createElement('div');
      e.className = 'topic-empty';
      e.textContent = 'Nothing here yet — add the first thing above.';
      sec.appendChild(e);
    }else if(!visible.length){
      const e = document.createElement('div');
      e.className = 'topic-empty';
      e.textContent = 'Nothing matches this filter.';
      sec.appendChild(e);
    }else{
      for(const it of visible){
        const row = document.createElement('div');
        row.className = 'item' + (it.got ? ' got' : '');
        row.innerHTML =
          '<div class="check" role="checkbox" aria-checked="'+it.got+'" tabindex="0"></div>' +
          '<div><div class="name"></div>' + (it.got ? '<div class="sub">crossed off</div>' : '') + '</div>' +
          '<span class="pri '+it.pri+'">'+PRI_LABEL[it.pri]+'</span>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<span class="price">'+(it.price||'')+'</span>' +
            '<button class="del" title="Remove" aria-label="Remove">&times;</button>' +
          '</div>';
        row.querySelector('.name').textContent = it.name;
        row.querySelector('.check').addEventListener('click', ()=>toggle(it.id));
        row.querySelector('.check').addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(it.id); }});
        row.querySelector('.del').addEventListener('click', ()=>removeItem(t.id, it.id));
        sec.appendChild(row);
      }
    }

    topicsEl.appendChild(sec);
  }

  const all = topics.flatMap(t=>t.items);
  const got = all.filter(i=>i.got).length;
  document.getElementById('st-topics').textContent = topics.length;
  document.getElementById('st-items').textContent = all.length;
  document.getElementById('st-got').textContent = got;
  countEl.textContent = topics.length + ' topic' + (topics.length!==1?'s':'') + ' · ' + all.length + ' item' + (all.length!==1?'s':'');
}

function toggle(id){
  for(const t of topics){ const it=t.items.find(i=>i.id===id); if(it){ it.got=!it.got; break; } }
  save(); render();
}
function removeItem(tid, id){
  const t = topics.find(t=>t.id===tid); if(t){ t.items = t.items.filter(i=>i.id!==id); save(); render(); }
}
function removeTopic(id){ topics = topics.filter(t=>t.id!==id); save(); render(); }

document.getElementById('topic-form').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('t-name').value.trim();
  if(!name) return;
  topics.push({id: nextId++, name, items:[]});
  save(); e.target.reset(); render();
  topicsEl.lastElementChild.scrollIntoView({behavior:'smooth', block:'center'});
});

function syncChips(){ document.querySelectorAll('#filters .chip').forEach(c=>c.classList.toggle('on', c.dataset.filter===filter)); }
document.getElementById('filters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  filter = chip.dataset.filter; syncChips(); render();
});

render();
</script>
</body>
</html>
